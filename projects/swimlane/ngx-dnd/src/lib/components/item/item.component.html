@switch (type) { @case ('array') {
<ngx-dnd-container
  [model]="model"
  [template]="container.template"
  [dropZone]="dropZone"
  [dropZones]="dropZones"
  [removeOnSpill]="removeOnSpill"
  [droppableItemClass]="droppableItemClass"
  [copy]="copy"
>
</ngx-dnd-container>
} @case ('object') { @if (container.template) {
<ng-template [ngTemplateOutlet]="container.template" [ngTemplateOutletContext]="data"> </ng-template>
} @if (!container.template) {
<div class="ngx-dnd-content">
  {{ model.label }}
</div>
@if (model.children) {
<ngx-dnd-container
  [model]="model.children"
  [template]="container.template"
  [dropZone]="dropZone"
  [dropZones]="dropZones"
  [removeOnSpill]="removeOnSpill"
  [droppableItemClass]="droppableItemClass"
  [copy]="copy"
>
</ngx-dnd-container>
} } } @case ('undefined') { } @default { @if (container.template) {
<ng-template [ngTemplateOutlet]="container.template" [ngTemplateOutletContext]="data"> </ng-template>
} @if (!container.template) {
<div class="ngx-dnd-content">
  {{ model }}
</div>
} } }
