<div
  ngxDroppable
  [dropZone]="dropZone"
  [model]="model"
  [copy]="copy"
  [ngClass]="{ 'gu-empty': !model?.length }"
  [removeOnSpill]="removeOnSpill"
  class="ngx-dnd-container"
>
  @if (model) { @for (item of model; track item) {
  <ngx-dnd-item
    ngxDraggable
    [model]="item"
    [dropZone]="dropZone"
    [dropZones]="dropZones"
    [copy]="copy"
    [moves]="moves"
    [removeOnSpill]="removeOnSpill"
    [droppableItemClass]="droppableItemClass"
  >
  </ngx-dnd-item>
  } } @if (!model) {
  <ng-content></ng-content>
  }
</div>
